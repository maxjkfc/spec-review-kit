# Single source of truth for which models run-spec-review dispatches.
# Edit here to change models; nothing else in this repo should hardcode a model id.
# Override per-invocation without editing this file: REVIEW_ALWAYS_MODEL=... REVIEW_ESCALATE_MODEL=...

# Runs on every review.
ALWAYS_MODEL="${REVIEW_ALWAYS_MODEL:-openai-codex/gpt-5.6-luna}"

# Added when the PR touches backend/service code, ships a real spec file, or touches
# config/auth/persistence/payments/concurrency. See docs/benchmark.md for why this
# pairing (not a third model) is the current default.
ESCALATE_MODEL="${REVIEW_ESCALATE_MODEL:-anthropic/claude-sonnet-5}"
